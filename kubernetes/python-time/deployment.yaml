# Rendered by infrastructure/terraform/eks-workloads (templatefile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-time
  namespace: python-time
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-time
  template:
    metadata:
      labels:
        app: python-time
    spec:
%{ if on_karpenter ~}
      # Brief §2: workload pods run on Karpenter-launched t3.medium capacity.
      nodeSelector:
        karpenter.sh/nodepool: ${karpenter_nodepool}
%{ endif ~}
      containers:
        - name: python-time
          image: ${image}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: python-time
  namespace: python-time
spec:
  type: ClusterIP
  selector:
    app: python-time
  ports:
    - name: http
      port: 80
      targetPort: 8000
