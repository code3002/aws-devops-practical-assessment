services:
  app:
    build: ./app
    restart: unless-stopped
    environment:
      PGHOST: ${PGHOST:?Set PGHOST}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:?Set PGDATABASE}
      PGUSER: ${PGUSER:?Set PGUSER}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
      PGSSLMODE: ${PGSSLMODE:-verify-full}
      PGSSLROOTCERT: ${PGSSLROOTCERT:-}
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      app:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    expose:
      - '9100'

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command:
      - '--nginx.scrape-uri=http://nginx:8080/stub_status'
    depends_on:
      - nginx
    expose:
      - '9113'

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - 'prometheus_data:/prometheus'
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - node-exporter
      - nginx-exporter

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: node_exporter
          static_configs:
            - targets: ['node-exporter:9100']

        - job_name: nginx_exporter
          static_configs:
            - targets: ['nginx-exporter:9113']

volumes:
  prometheus_data:
