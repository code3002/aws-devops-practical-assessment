apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: assessment
spec:
  role: KarpenterNodeRole-aws-devops-assessment-eks-01-eks
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - id: subnet-0c0d70375cb49b594
    - id: subnet-08cd19e51f753b99a
  securityGroupSelectorTerms:
    - id: sg-072c8bcfd65fb031f
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: assessment
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: assessment
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium"]
      expireAfter: 720h
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
