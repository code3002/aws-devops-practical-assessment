# Rendered by infrastructure/terraform/eks-workloads (templatefile).
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: assessment
spec:
  role: ${node_role_name}
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
%{ for subnet in subnet_ids ~}
    - id: ${subnet}
%{ endfor ~}
  securityGroupSelectorTerms:
    - id: ${security_group_id}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: assessment
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: assessment
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium"]
      expireAfter: 720h
  limits:
    cpu: "8"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
